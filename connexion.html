<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion FIL ROUGE</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/png" href="/img/logo.png">
</head>
<body class="page_connexion">
    <div class="connexion_container">
        <form id="form_connexion">
            <fieldset class="connexion">
                <legend>Formulaire de connexion</legend>
                <div class="champ">
                    <label for="id_mail">Adresse mail :</label><input type="email" name="login" id="id_mail" placeholder="nom@domaine.com" required size="20"><br>
                </div>
                <div class="champ">
                    <label for="id_pass">Mot de passe :</label><input type="password" name="pass" id="id_pass" required size="10"><br>
                </div>
                <p id="message" class=""></p>
                <p id="text_nouv">Vous êtes nouveau ? Alors créez-vous un compte <a href="inscription.html">ici</a></p>
                <input type="submit" name="connect" value="Connexion">
            </fieldset>
        </form>
    </div>
    
</body>
</html>
