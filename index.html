<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil FIL ROUGE</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <article class="accueil">
        <aside class="colonne_conversation">
            <div class="entete entete_conversation">
                <div class="avatar"></div>
                <button class="bouton_menu" title="Paramètres du compte"><i class="fa-solid fa-gear"></i></button>
            </div>
            <ul class="liste_conversation">
            </ul>
            <button class="nouvelle_conversation">Nouvelle conversation</button>
        </aside>
        <section class="colonne_discussion">
            <div class="entete entete_discussion">
                <div class="avatar"></div>
                </div>
            </div>

            <div class="liste_message" id="liste_message">
            </div>

            <form class="zone_message" id="formulaire-message">
                <input type="text" class="champ_message" id="champ-message" placeholder="Écrire un message..." autocomplete="off">

                <button type="submit" class="bouton_envoyer"
                        aria-label="Envoyer le message">
                    <i class="fa-regular fa-paper-plane"
                        style="color: #0081c7;"></i>
                </button>
            </form>
        </section>
    </article>
    <script src="js/script.js"></script> 
</body>
</html>
