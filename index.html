<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil FIL ROUGE</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Accueil : conversations et contacts à gauche, discussion à droite -->
    <article class="accueil">
        <aside class="colonne_conversation">
            <!-- Mon avatar (+ bouton pour publier une story) et accès aux paramètres -->
            <div class="entete entete_conversation">
                <div class="mon_profil">
                    <div class="avatar" id="mon_avatar"></div>
                    <button type="button" class="ajout_story" id="bouton_ajout_story" title="Publier une story">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                    <input type="file" id="input_story" accept="image/png, image/jpeg, image/webp, video/mp4, video/webm" hidden>
                </div>
                <span class="mon_pseudo" id="mon_pseudo"></span>
                <a href="parametres.html" class="bouton_menu" title="Paramètres du compte"><i class="fa-solid fa-gear"></i></a>
            </div>

            <!-- ===== Onglets Discussions / Contacts ===== -->
            <div class="onglets" role="tablist">
                <button type="button" class="onglet onglet_actif" id="onglet_discussions" role="tab"
                        aria-selected="true" aria-controls="panneau_discussions" data-onglet="discussions">
                    <i class="fa-solid fa-comments"></i> Discussions
                </button>
                <button type="button" class="onglet" id="onglet_contacts" role="tab"
                        aria-selected="false" aria-controls="panneau_contacts" data-onglet="contacts">
                    <i class="fa-solid fa-address-book"></i> Contacts
                </button>
            </div>

            <!-- ===== Panneau Discussions ===== -->
            <div class="panneau" id="panneau_discussions" role="tabpanel" aria-labelledby="onglet_discussions">
                <ul class="liste_conversation">
                </ul>
                <button class="nouvelle_conversation">Nouvelle conversation</button>
            </div>

            <!-- ===== Panneau Contacts ===== -->
            <div class="panneau" id="panneau_contacts" role="tabpanel" aria-labelledby="onglet_contacts" hidden>
                <div class="recherche_contact">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="search" id="recherche_contact" placeholder="Rechercher…"
                        aria-label="Rechercher un contact" autocomplete="off">
                </div>
                <p class="compteur_contacts" id="compteur_contacts"></p>
                <ul class="liste_contacts" id="liste_contacts"></ul>
                <div class="contacts_vide" id="contacts_vide" hidden>
                    <i class="fa-solid fa-user-group"></i>
                    <p id="texte_contacts_vide"></p>
                </div>
                <button type="button" class="bouton_ajout_contact" id="bouton_ajout_contact">
                    <i class="fa-solid"></i> Ajouter un contact
                </button>
            </div>
        </aside>

        <!-- ===== Zone de discussion ===== -->
        <section class="colonne_discussion">
            <div class="entete entete_discussion">
                <div class="avatar"></div>
                <span class="nom_contact" id="nom-contact">Contact</span>
            </div>

            <div class="liste_message" id="liste_message" data-vide="Sélectionnez une conversation pour commencer à discuter"></div>

            <!-- Saisie d'un message (désactivée tant qu'aucune conversation n'est ouverte) -->
            <form class="zone_message" id="formulaire-message">
                <input type="text" class="champ_message" id="champ-message" placeholder="Sélectionnez une conversation" autocomplete="off" disabled>

                <button type="submit" class="bouton_envoyer" id="bouton-envoyer"
                        aria-label="Envoyer le message" disabled>
                    <i class="fa-regular fa-paper-plane"></i>
                </button>
            </form>
        </section>
    </article>

    <!-- ===== Fenêtre : retirer un contact ===== -->
    <dialog class="modale" id="modale_retrait_contact" aria-labelledby="titre_retrait_contact">
        <div class="modale_contenu">
            <h2 id="titre_retrait_contact"><i class="fa-solid fa-user-minus"></i> Retirer ce contact ?</h2>
            <p class="modale_texte"><strong id="nom_retrait_contact"></strong> sera retiré(e) de votre liste de contacts.</p>
            <div class="modale_actions">
                <button type="button" class="bouton_secondaire" data-fermer>Annuler</button>
                <button type="button" class="bouton_danger" id="confirmer_retrait_contact">Retirer</button>
            </div>
        </div>
    </dialog>

    <!-- ===== Lecteur de story ===== -->
    <dialog class="lecteur_story" id="lecteur_story" aria-label="Story">
        <div class="story_progression" id="story_progression"></div>

        <div class="story_entete">
            <span class="avatar_contact" id="story_avatar"></span>
            <div class="story_infos">
                <span class="story_pseudo" id="story_pseudo"></span>
                <span class="story_date" id="story_date"></span>
            </div>
            <button type="button" class="story_fermer" data-fermer aria-label="Fermer la story">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <img class="story_image" id="story_image" alt="">
        <video class="story_video" id="story_video" playsinline hidden></video>
        <p class="story_texte" id="story_texte"></p>

        <button type="button" class="story_zone story_precedente" id="story_precedente" aria-label="Story précédente"></button>
        <button type="button" class="story_zone story_suivante" id="story_suivante" aria-label="Story suivante"></button>
    </dialog>

    <!-- Bibliothèque Supabase, configuration, puis script de la page -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
